<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART DM</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Konfigurasi Babel
    Babel.registerPreset('my-custom-preset', {
      presets: [
        [Babel.availablePresets['env'], { targets: "> 0.25%, not dead" }],
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@0.288.0/dist/umd/lucide.min.js"></script>

  <style>
    /* =========================================
       NEUMORPHISM UI CSS SYSTEM
       ========================================= */
    :root {
      --bg-color: #e0e5ec;
      --shadow-dark: #a3b1c6;
      --shadow-light: #ffffff;
      --text-main: #4a5568;
      --text-muted: #718096;
      --primary: #3b82f6;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Utilitas Menyembunyikan Scrollbar namun tetap berfungsi */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 10px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .neu-bg {
      background-color: var(--bg-color);
    }

    /* Panel Timbul (Convex) - Untuk Card & Container Utama */
    .neu-panel {
      background-color: var(--bg-color);
      box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Area Cekung (Concave) - Untuk Dropzone, Input, Tabel Box */
    .neu-in {
      background-color: var(--bg-color);
      box-shadow: inset 7px 7px 14px var(--shadow-dark), inset -7px -7px 14px var(--shadow-light);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .neu-in-active {
      box-shadow: inset 12px 12px 24px var(--shadow-dark), inset -12px -12px 24px var(--shadow-light);
    }

    /* Tombol Interaktif Timbul */
    .neu-btn {
      background-color: var(--bg-color);
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 1rem;
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .neu-btn:hover:not(:disabled) {
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
      transform: translateY(-2px);
    }
    .neu-btn:active:not(:disabled) {
      box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
      transform: translateY(1px);
      border-color: transparent;
    }
    .neu-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    }

    /* Tombol Bundar (Icon Box) */
    .neu-icon {
      background-color: var(--bg-color);
      box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Input Text Khusus */
    .neu-input {
      background-color: var(--bg-color);
      box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
      border: none;
      color: var(--text-main);
      transition: all 0.3s ease;
    }
    .neu-input:focus {
      outline: none;
      box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
    }

    /* Tabel Neumorphism yang dibulatkan (Oval) */
    .neu-table-wrapper {
      border-radius: 1.5rem; /* Memberikan bentuk oval di sudut */
      overflow: hidden; /* Memotong konten tabel yang keluar dari sudut oval */
    }
    .neu-table th { background-color: rgba(224, 229, 236, 0.9); }
    .neu-table tr { transition: background-color 0.2s; border-bottom: 1px solid rgba(163, 177, 198, 0.2); }
    .neu-table tr:hover { background-color: rgba(255, 255, 255, 0.4); }
    .neu-table tr:last-child { border-bottom: none; }

    /* Animasi Bawaan */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-float { animation: float 4s ease-in-out infinite; }
    .animate-spin-slow { animation: spin 3s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="my-custom-preset">
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbqlkHSkdV_haQfVH4AbKCMTlx2RQAfiXRAsA8lsNkZdfkHj6PdorWsNiP4XVgwDiD/exec';
    
    const { useState, useEffect, useRef } = React;
    
    const iconMap = {
      FileUp: 'file-up', Download: 'download', Search: 'search', Trash2: 'trash-2',
      FileSpreadsheet: 'file-spreadsheet', CheckCircle2: 'check-circle-2', AlertCircle: 'alert-circle',
      Loader2: 'loader-2', Filter: 'filter', Users: 'users', Activity: 'activity', FolderOpen: 'folder-open',
      AlertTriangle: 'alert-triangle', ChevronRight: 'chevron-right', ChevronLeft: 'chevron-left', RefreshCw: 'refresh-cw',
      UploadCloud: 'upload-cloud', Database: 'database', Check: 'check', ArrowRight: 'arrow-right',
      ArrowLeft: 'arrow-left', CloudUpload: 'cloud-upload', Copy: 'copy', Home: 'home', User: 'user', 
      Lock: 'lock', LogIn: 'log-in', ExternalLink: 'external-link'
    };

    const createLucideIcon = (name) => {
      const kebabName = iconMap[name];
      return ({ className }) => {
        const spanRef = React.useRef(null);
        React.useEffect(() => {
          if (spanRef.current && window.lucide) {
            spanRef.current.innerHTML = `<i data-lucide="${kebabName}" class="${className || ''}"></i>`;
            window.lucide.createIcons({ root: spanRef.current, icons: window.lucide.icons });
          }
        }, [className]);
        return <span ref={spanRef} style={{ display: 'contents' }} />;
      };
    };

    const FileUp = createLucideIcon('FileUp'); const Download = createLucideIcon('Download');
    const Trash2 = createLucideIcon('Trash2'); const FileSpreadsheet = createLucideIcon('FileSpreadsheet'); 
    const CheckCircle2 = createLucideIcon('CheckCircle2'); const AlertCircle = createLucideIcon('AlertCircle'); 
    const Loader2 = createLucideIcon('Loader2'); const Filter = createLucideIcon('Filter'); 
    const FolderOpen = createLucideIcon('FolderOpen'); const AlertTriangle = createLucideIcon('AlertTriangle'); 
    const ChevronRight = createLucideIcon('ChevronRight'); const ChevronLeft = createLucideIcon('ChevronLeft'); 
    const RefreshCw = createLucideIcon('RefreshCw'); const UploadCloud = createLucideIcon('UploadCloud'); 
    const Database = createLucideIcon('Database'); const Check = createLucideIcon('Check'); 
    const ArrowRight = createLucideIcon('ArrowRight'); const ArrowLeft = createLucideIcon('ArrowLeft'); 
    const Copy = createLucideIcon('Copy'); const Home = createLucideIcon('Home'); 
    const User = createLucideIcon('User'); const LogIn = createLucideIcon('LogIn'); 
    const ExternalLink = createLucideIcon('ExternalLink');

    const DMLogo = ({ className }) => (
      <svg className={className} viewBox="0 0 100 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 0C50 0 10 50 10 80C10 102.091 27.9086 120 50 120C72.0914 120 90 102.091 90 80C90 62 76 38 50 0Z" fill="currentColor"/>
        <path d="M25 85C25 100 35 108 50 108" stroke="#FFFFFF" strokeWidth="6" strokeLinecap="round" fill="none"/>
        <g transform="translate(45, 30)">
          <path d="M22.5 0L45 10V35L22.5 45L0 35V10L22.5 0Z" fill="#F8FAFC" stroke="#E2E8F0" strokeWidth="4" strokeLinejoin="round"/>
          <path d="M0 10L22.5 20L45 10" stroke="#E2E8F0" strokeWidth="4" strokeLinejoin="round"/>
          <path d="M22.5 20V45" stroke="#E2E8F0" strokeWidth="4" strokeLinejoin="round"/>
        </g>
      </svg>
    );

    const App = () => {
      // Auth State
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loggedInUser, setLoggedInUser] = useState('');
      const [loginForm, setLoginForm] = useState({ username: '' });
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [loginAnimatingOut, setLoginAnimatingOut] = useState(false);

      // Global State
      const [step, setStep] = useState(1); 
      const [toast, setToast] = useState({ show: false, msg: '', sub: '', type: 'success' });
      const [isProcessing, setIsProcessing] = useState(false);
      const [isSavingToSheet, setIsSavingToSheet] = useState(false);
      
      const [userTargetUrl, setUserTargetUrl] = useState('');
      const [userKemenkesUrl, setUserKemenkesUrl] = useState('');

      // Transition & Modal States
      const [isAutoTransitioning, setIsAutoTransitioning] = useState(false);
      const [isAutoTransitioningFinal, setIsAutoTransitioningFinal] = useState(false);
      const [confirmModal, setConfirmModal] = useState({ show: false, title: '', message: '', onConfirm: null, type: 'warning' });

      // Data States
      const [database, setDatabase] = useState([]);
      const [uploadResult, setUploadResult] = useState(null);
      const [currentPage, setCurrentPage] = useState(1); // State Paginasi
      
      const [fileDM, setFileDM] = useState(null);
      const [dragActiveDM, setDragActiveDM] = useState(false);
      const [syncStatusMsg, setSyncStatusMsg] = useState(null);

      const showToast = (msg, sub = 'Berhasil', type = 'success') => {
        setToast({ show: true, msg, sub, type });
        setTimeout(() => setToast({ show: false, msg: '', sub: '', type: 'success' }), 5000);
      };

      const triggerConfirm = (title, message, onConfirm, type = 'warning') => {
        setConfirmModal({ show: true, title, message, onConfirm, type });
      };

      const closeConfirm = () => setConfirmModal({ ...confirmModal, show: false });

      const resetAllData = () => {
        setDatabase([]); setFileDM(null); setSyncStatusMsg(null); setStep(1); setUploadResult(null); setCurrentPage(1);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (SCRIPT_URL.includes('GANTI_DENGAN_URL_ANDA')) {
            showToast('Konfigurasi Dibutuhkan', 'Ganti SCRIPT_URL dengan Web App URL API Anda di script.', 'warning');
            return;
        }
        setIsLoggingIn(true);
        try {
          const response = await fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(loginForm.username)}`);
          const result = await response.json();
          
          if (result.success && result.data && result.data.valid) {
            setUserTargetUrl(result.data.targetUrl);
            setUserKemenkesUrl(result.data.kemenkesUrl);
            setLoggedInUser(loginForm.username);
            triggerLoginSuccess();
          } else {
             if (result.error) showToast('Error Server', result.error, 'error');
             else showToast('Gagal Login', 'Username tidak terdaftar di Database', 'error');
             setIsLoggingIn(false);
          }
        } catch (error) {
          showToast('Error Koneksi', 'Gagal memverifikasi ke server API: ' + error.message, 'error');
          setIsLoggingIn(false);
        }
      };

      const triggerLoginSuccess = () => {
        setLoginAnimatingOut(true);
        setTimeout(() => {
          setIsLoggedIn(true); setIsLoggingIn(false);
          showToast('Berhasil Masuk', 'Selamat datang di SMART DM', 'success');
        }, 1000);
      };

      const handleResetDatabase = () => {
        triggerConfirm('Reset Data Spreadsheet', 'PERINGATAN: Menghapus isian pada kolom C-R pada Sheet "Puskesmas". Lanjutkan?', 
          async () => {
            setIsProcessing(true);
            try {
              const response = await fetch(SCRIPT_URL, {
                method: 'POST', body: JSON.stringify({ action: 'resetData', targetUrl: userTargetUrl })
              });
              const result = await response.json();
              setIsProcessing(false);
              if (result.success) {
                  resetAllData(); showToast("Berhasil Dikosongkan", result.data.status || 'Berhasil', "success");
              } else {
                  showToast("Error", result.error || 'Terjadi kesalahan sistem', "error");
              }
            } catch (error) {
              setIsProcessing(false); showToast("Error Koneksi", error.message, "error");
            }
          }, 'danger'
        );
      };

      const handleCopyReport = async () => {
        setIsProcessing(true);
        try {
          const response = await fetch(`${SCRIPT_URL}?action=copyRekap&targetUrl=${encodeURIComponent(userTargetUrl)}`);
          const result = await response.json();
          setIsProcessing(false);
          if (result.success && result.data.text && result.data.text !== "Error") {
            const textArea = document.createElement("textarea");
            textArea.value = result.data.text; document.body.appendChild(textArea); textArea.select();
            try { document.execCommand('copy'); showToast("Berhasil Disalin", "Isian Rekap siap di-paste.", "success"); } 
            catch (err) { showToast("Gagal Menyalin", "Browser Anda memblokir fungsi copy.", "error"); }
            document.body.removeChild(textArea);
          } else {
             showToast("Gagal Menyalin", result.error || "Data rekap gagal diambil atau API server ditutup.", "error");
          }
        } catch (error) {
          setIsProcessing(false); showToast("Error Jaringan", error.message, "error");
        }
      };

      const handleOpenPasteLink = () => {
        if (userKemenkesUrl && String(userKemenkesUrl).trim().startsWith('http')) {
          window.open(String(userKemenkesUrl).trim(), '_blank');
          showToast("Membuka Link", "Membuka Kertas Kerja B...", "success");
        } else {
          showToast("Link Tidak Valid", "Pastikan Kolom C berisi link valid.", "error");
        }
      };
      
      const handleOpenKertasKerjaA = () => {
        if (userTargetUrl && String(userTargetUrl).trim().startsWith('http')) {
          window.open(String(userTargetUrl).trim(), '_blank');
          showToast("Membuka Spreadsheet", "Membuka Kertas Kerja A...", "success");
        } else {
          showToast("Link Tidak Valid", "Pastikan Kolom B berisi link Spreadsheet valid.", "error");
        }
      };

      const parseLabNumber = (val) => {
        if (val === null || val === undefined) return null;
        const str = String(val).trim().replace(',', '.');
        const match = str.match(/[-+]?[0-9]*\.?[0-9]+/);
        if (match && match[0] !== '') {
          const num = parseFloat(match[0]); return isNaN(num) ? null : num;
        }
        return null;
      };

      const getSmallestLabValue = (val1, val2) => {
        if (!val1 || val1 === '-') return val2 || '-';
        if (!val2 || val2 === '-') return val1;
        const num1 = parseLabNumber(val1); const num2 = parseLabNumber(val2);
        if (num1 !== null && num2 !== null) return num2 < num1 ? val2 : val1;
        if (num1 !== null && num2 === null) return val1;
        if (num1 === null && num2 !== null) return val2;
        return val1 || val2 || 'V';
      };

      const getMonthIndex = (value) => {
        if (!value) return -1;
        const strVal = String(value).trim(); const parts = strVal.split(/[-.\/]/);
        if (parts.length >= 2) { const mPart = parseInt(parts[1], 10); if (mPart >= 1 && mPart <= 12) return mPart - 1; }
        const cleanDigits = strVal.replace(/[^0-9]/g, '');
        if (cleanDigits.length === 6) { const mPart = parseInt(cleanDigits.substring(2, 4), 10); if (mPart >= 1 && mPart <= 12) return mPart - 1; }
        let date;
        if (value instanceof Date) date = value;
        else if (typeof value === 'number') date = new Date(Math.round((value - 25569) * 86400 * 1000));
        else { const parsed = new Date(value); if (!isNaN(parsed.getTime())) date = parsed; }
        return date && !isNaN(date.getTime()) ? date.getMonth() : -1;
      };

      const getCellValueDeep = (worksheet, r, c) => {
        const XLSX = window.XLSX; if (!XLSX) return "";
        if (worksheet['!merges']) {
          for (const merge of worksheet['!merges']) {
            if (r >= merge.s.r && r <= merge.e.r && c >= merge.s.c && c <= merge.e.c) {
              const firstCell = worksheet[XLSX.utils.encode_cell({ r: merge.s.r, c: merge.s.c })]; return firstCell ? (firstCell.w || firstCell.v || "") : "";
            }
          }
        }
        const cell = worksheet[XLSX.utils.encode_cell({ r, c })]; return cell ? (cell.w || (cell.v !== undefined ? String(cell.v) : "")) : "";
      };

      const handleMonitoringUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length || !window.XLSX) return;
        setIsProcessing(true);
        let updatedDatabase = [...database]; let totalNew = 0; let totalUpdated = 0;

        try {
          const validFiles = files.filter(file => file.name.match(/\.(xlsx|xls|csv)$/i));
          if (validFiles.length === 0) { showToast('Gagal', 'Tidak ditemukan file Excel yang valid', 'error'); return; }

          for (const file of validFiles) {
            const data = await file.arrayBuffer();
            const workbook = window.XLSX.read(new Uint8Array(data), { type: 'array', cellDates: true, cellText: true });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            if (!sheet || !sheet['!ref']) continue;
            const range = window.XLSX.utils.decode_range(sheet['!ref']);

            for (let r = 10; r <= range.e.r; r += 2) {
              const rawB = getCellValueDeep(sheet, r, 1);
              const rawF = getCellValueDeep(sheet, r, 5) || getCellValueDeep(sheet, r, 4) || getCellValueDeep(sheet, r, 6);
              const rawV = getCellValueDeep(sheet, r, 21);
              const colD = getCellValueDeep(sheet, r, 3); const colE = getCellValueDeep(sheet, r, 4);
              const colF = getCellValueDeep(sheet, r, 5); const colG = getCellValueDeep(sheet, r, 6);
              const colH = getCellValueDeep(sheet, r, 7); const colL = getCellValueDeep(sheet, r, 11);

              if (!rawF || rawF === "-" || rawF === "Data_Pasien") continue;
              
              const monthIdx = getMonthIndex(rawB); const patientId = rawF;
              const existingIndex = updatedDatabase.findIndex(p => String(p.id).trim().toLowerCase() === String(patientId).trim().toLowerCase());
              const incomingLab = (rawV !== undefined && rawV !== null && String(rawV).trim() !== "") ? String(rawV).trim() : "V";

              if (existingIndex !== -1) {
                if (monthIdx !== -1) updatedDatabase[existingIndex].months[monthIdx] = getSmallestLabValue(updatedDatabase[existingIndex].months[monthIdx], incomingLab);
                if (!updatedDatabase[existingIndex].desa || updatedDatabase[existingIndex].desa === 'TIDAK DIKETAHUI') {
                  updatedDatabase[existingIndex].desa = colH || 'TIDAK DIKETAHUI'; updatedDatabase[existingIndex].colD = colD || '';
                  updatedDatabase[existingIndex].colE = colE || ''; updatedDatabase[existingIndex].colF = colF || '';
                  updatedDatabase[existingIndex].colG = colG || ''; updatedDatabase[existingIndex].colL = colL || '';
                }
                totalUpdated++;
              } else {
                const newPatient = {
                  id: patientId, name: rawF, info: file.name, months: new Array(12).fill('-'), diagnosaDate: '-',
                  desa: colH || 'TIDAK DIKETAHUI', colD: colD || '', colE: colE || '', colF: colF || '', colG: colG || '', colL: colL || ''
                };
                if (monthIdx !== -1) newPatient.months[monthIdx] = incomingLab;
                updatedDatabase.push(newPatient); totalNew++;
              }
            }
          }
          setDatabase(updatedDatabase); showToast('Matriks Berhasil Diperbarui', `${totalNew} Baru, ${totalUpdated} Diperbarui`, 'success');
          
          if (step === 1 && (totalNew > 0 || totalUpdated > 0)) {
            setIsAutoTransitioning(true);
            setTimeout(() => { showToast('Transisi Otomatis', 'Menuju Sinkronisasi...', 'success'); }, 500);
            setTimeout(() => { setStep(2); setIsAutoTransitioning(false); }, 2500);
          }
        } catch (err) { showToast('Gagal memproses file', 'Kesalahan format', 'error'); } 
        finally { setIsProcessing(false); e.target.value = null; }
      };

      const getTodayString = () => {
        const today = new Date(); const day = String(today.getDate()).padStart(2, '0');
        const month = String(today.getMonth() + 1).padStart(2, '0'); const year = today.getFullYear();
        return `${day}/${month}/${year}`;
      };

      const extractValidDate = (cell) => {
        if (!cell || cell.v === undefined || cell.v === null) return null;
        let dateObj = null;
        if (cell.v instanceof Date) dateObj = cell.v;
        else if (typeof cell.v === 'number' && cell.v > 1000) dateObj = new Date(Math.round((cell.v - 25569) * 86400 * 1000));
        else if (typeof cell.v === 'string') { const parsed = new Date(cell.v.trim()); if (!isNaN(parsed.getTime())) dateObj = parsed; }
        if (!dateObj || isNaN(dateObj.getTime())) return null;
        const day = String(dateObj.getDate()).padStart(2, '0'); const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const year = dateObj.getFullYear();
        return `${day}/${month}/${year}`;
      };

      const handleSyncProcess = async (uploadedFile = fileDM) => {
        if (!uploadedFile || !window.XLSX || database.length === 0) return;
        setIsProcessing(true); setSyncStatusMsg(null);
        try {
          const dmData = await uploadedFile.arrayBuffer(); const XLSX = window.XLSX;
          const workbookDM = XLSX.read(new Uint8Array(dmData), { type: 'array', cellDates: true });
          const dmSheet = workbookDM.Sheets[workbookDM.SheetNames[0]];
          if (!dmSheet['!ref']) throw new Error("Format sheet DM tidak valid");

          const dmMap = new Map(); const dmRange = XLSX.utils.decode_range(dmSheet['!ref']);
          for (let r = 9; r <= dmRange.e.r; r++) {
            const cellC = dmSheet[XLSX.utils.encode_cell({r: r, c: 2})]; const cellE = dmSheet[XLSX.utils.encode_cell({r: r, c: 4})]; 
            if (cellC && cellC.v !== undefined) {
              let key = cellC.v.toString().trim().toLowerCase(); let validDateStr = extractValidDate(cellE);
              if (validDateStr) dmMap.set(key, validDateStr);
            }
          }

          let matchCount = 0; let autoFillCount = 0; const todayFormatted = getTodayString();
          const updatedDatabase = database.map(patient => {
            const idKey = String(patient.id).trim().toLowerCase(); const nameKey = String(patient.name).trim().toLowerCase();
            let diagDate = todayFormatted;
            if (dmMap.has(idKey)) { diagDate = dmMap.get(idKey); matchCount++; } 
            else if (dmMap.has(nameKey)) { diagDate = dmMap.get(nameKey); matchCount++; } 
            else { autoFillCount++; }
            return { ...patient, diagnosaDate: diagDate };
          });

          setDatabase(updatedDatabase);
          setSyncStatusMsg({ type: 'success', text: `Berhasil! ${matchCount} cocok. ${autoFillCount} baru.` });
          setIsAutoTransitioningFinal(true); showToast('Selesai', 'Menyimpan ke server...', 'success');
          
          setTimeout(() => { setIsAutoTransitioningFinal(false); saveToGoogleSheets(updatedDatabase); }, 1800);
        } catch (err) {
          setSyncStatusMsg({ type: 'error', text: 'GAGAL membaca file DM.' }); showToast('Gagal', 'Periksa file Excel Anda.', 'error');

                        <div className="px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                          <span className="text-sm font-bold text-slate-500">
                            Menampilkan {startIndex + 1}-{Math.min(startIndex + itemsPerPage, uploadResult.length)} dari {uploadResult.length} pasien
                          </span>
                          <div className="flex items-center gap-4">
                            <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="neu-btn w-12 h-12">
                              <ChevronLeft className="w-5 h-5 text-slate-600" />
                            </button>
                            <span className="text-sm font-black text-slate-700 px-2 neu-in py-2 px-4 rounded-xl">
                              Hal {currentPage} / {totalPages}
                            </span>
                            <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="neu-btn w-12 h-12">
                              <ChevronRight className="w-5 h-5 text-slate-600" />
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </main>
            </div>
          </div>

          {/* Modal Konfirmasi Neumorphism */}
          {confirmModal.show && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" onClick={closeConfirm}></div>
              <div className="neu-panel w-full max-w-md relative z-10 p-8 flex flex-col gap-6">
                <div className="flex items-center gap-5">
                  <div className={`neu-in p-4 rounded-2xl ${confirmModal.type === 'danger' ? 'text-rose-500' : 'text-amber-500'}`}>
                    {confirmModal.type === 'danger' ? <AlertCircle className="w-8 h-8" /> : <AlertTriangle className="w-8 h-8" />}
                  </div>
                  <h3 className="text-xl font-black text-slate-700 tracking-tight leading-snug">{confirmModal.title}</h3>
                </div>
                <p className="text-slate-600 text-sm font-medium px-1">{confirmModal.message}</p>
                <div className="flex gap-4 mt-2">
                  <button onClick={closeConfirm} className="neu-btn flex-1 py-3 text-slate-500 font-bold">Batal</button>
                  <button onClick={() => { if(confirmModal.onConfirm) confirmModal.onConfirm(); closeConfirm(); }} className={`neu-btn flex-1 py-3 font-bold ${confirmModal.type === 'danger' ? 'text-rose-600' : 'text-blue-600'}`}>Ya, Lanjutkan</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Neumorphism */}
          {toast.show && (
            <div className="fixed top-8 left-1/2 -translate-x-1/2 z-[110] animate-in slide-in-from-top-10 duration-300">
              <div className="neu-panel px-6 py-4 flex items-center gap-4 min-w-[320px] md:min-w-[360px] !rounded-[2rem]">
                <div className={`neu-icon w-12 h-12 flex items-center justify-center flex-shrink-0 ${toast.type === 'error' ? 'text-rose-500' : toast.type === 'warning' ? 'text-amber-500' : 'text-blue-500'}`}>
                  {toast.type === 'error' ? <AlertCircle className="w-6 h-6" /> : <CheckCircle2 className="w-6 h-6" />}
                </div>
                <div>
                  <p className="text-sm md:text-base font-black text-slate-700 tracking-tight">{toast.msg}</p>
                  <p className="text-[11px] md:text-xs text-slate-500 font-bold mt-0.5">{toast.sub}</p>
                </div>
              </div>
            </div>
          )}

          {/* Global Loading Overlay Neumorphism */}
          {(isProcessing || isSavingToSheet) && (
            <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/20 backdrop-blur-sm">
              <div className="neu-panel p-10 md:p-14 rounded-[3rem] flex flex-col items-center gap-6 relative z-10">
                <div className="relative w-28 h-28 flex items-center justify-center neu-in rounded-full">
                  <div className="w-16 h-16 neu-icon flex items-center justify-center text-blue-500 animate-pulse">
                    <DMLogo className="w-8 h-8" />
                  </div>
                  <div className="absolute inset-0 border-[4px] border-transparent border-t-blue-500 rounded-full animate-spin-slow"></div>
                </div>
                <div className="flex flex-col text-center mt-2">
                  <span className="text-xl md:text-2xl font-black tracking-tight text-slate-700 mb-2">{isSavingToSheet ? 'Menyimpan Data...' : 'Memproses File...'}</span>
                  <span className="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em]">Sistem Sedang Bekerja</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
